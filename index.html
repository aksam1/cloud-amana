<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <meta name="description" content="Learn Islam through the stories of the prophets, told in light. Free and private. No account needed." />
    <title>Amanah: the stories of the prophets</title>
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" href="/seal.svg" type="image/svg+xml" />
    <!-- The app can be installed and works offline (web build only). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Amanah" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amanah" />

  <body>
    <div id="root"></div>
    <!-- Netlify finds this form when it builds the site, and the app posts to it (web build only). -->
    <form name="report" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="kind" />
      <input type="text" name="where" />
      <textarea name="message"></textarea>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
