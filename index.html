<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060d" />
    <meta name="description" content="Learn Islam through the stories of the prophets, told in light. Free and private. No account needed." />
    <title>Amanah: the stories of the prophets</title>
    <link rel="canonical" href="%SITE_URL%" />
    <link rel="icon" href="/seal.svg" type="image/svg+xml" />
    <!-- The app can be installed and works offline (web build only). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Amanah" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amanah" />
    <meta property="og:title" content="Amanah: the stories of the prophets, told in light" />
    <meta property="og:description" content="Learn Islam one story at a time. Free and private. No account needed." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="position: fixed; inset: 0; overflow: auto; background: #0e0c18; color: #f3e9d2; font: 1.2rem/1.5 Georgia, serif; text-align: center">
        <div style="max-width: 36rem; margin: 15vh auto; padding: 0 1.5rem">
          <h1 style="font-size: 2rem; font-weight: 600; color: #e2bb68">Amanah</h1>
          <p>The stories of the prophets, told in light.</p>
          <p>Amanah needs JavaScript to play its stories. Please turn it on for this site, or open it in another browser.</p>
        </div>
      </div>
    </noscript>
    <!-- Netlify finds this form when it builds the site, and the app posts to it (web build only). -->
    <form name="report" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="kind" />
      <input type="text" name="where" />
      <textarea name="message"></textarea>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
