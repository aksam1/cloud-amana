# Runs on every push and pull request: the content rules, the engine's unit tests, a production build,
# and the end-to-end journeys in a real browser. A red cross on GitHub means something a user would hit.
name: CI
on:
  push:
  pull_request:

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content rules (verses, titles, lessons, pyramid data)
        run: npm run check
      - name: Unit tests (scoring, placement, wording)
        run: npm test
      - name: Production build
        run: npm run build

  journeys:
    runs-on: ubuntu-latest
    needs: check-test-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end journeys (phone and desktop)
        run: npm run e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
